version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm install -g pnpm
        - echo "shamefully-hoist=true" >> .npmrc
        - echo "node-linker=hoisted" >> .npmrc
        - pnpm install --frozen-lockfile
    build:
      commands:
        - env | grep -e DATABASE_URL >> .env.production
        - env | grep -e BETTER_AUTH_SECRET >> .env.production
        - env | grep -e BETTER_AUTH_URL >> .env.production
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*